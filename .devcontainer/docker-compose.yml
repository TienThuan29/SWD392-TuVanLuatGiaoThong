services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8222:8222"
      - "8989:8989"
      - "8080:8080"
      - "8888:8888"
    volumes:
      - ..:/workspace:cached 
    depends_on:
      - rabbitmq
    command: sleep infinity

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # RabbitMQ (AMQP)
      - "15672:15672" # RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 29112004thuan

  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
