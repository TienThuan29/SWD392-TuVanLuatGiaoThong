services:
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    image: config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - CONFIG_IMPORT_SERVER_URL={YOUR_CONFIG_IMPORT_SERVER_URL} #configserver:http://config-server:8888
    depends_on:
      rabbit-mq:
        condition: service_healthy
    networks:
      - aas-app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/v1/configserver/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway-service:
    build:
      context: ./api-gateway-service
      dockerfile: Dockerfile
    image: api-gateway-service
    container_name: api-gateway-service
    ports:
      - "8222:8222"
    environment:
      - CONFIG_IMPORT_SERVER_URL={YOUR_CONFIG_IMPORT_SERVER_URL}
      - CLASSROOM_SERVICE_URL={YOUR_CLASSROOM_SERVICE_URL}
      - SUBMISSION_SERVICE_URL={YOUR_SUBMISSION_SERVICE_URL}
    depends_on:
      rabbit-mq:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - aas-app-network

