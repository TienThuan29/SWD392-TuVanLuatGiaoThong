  rabbit-mq:
    image: rabbitmq:3-management
    container_name: rabbit-mq
    ports:
      - "5672:5672" # RabbitMQ message broker port
      - "15672:15672" # RabbitMQ management console
    environment:
      RABBITMQ_DEFAULT_USER: {YOUR_RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: {YOUR_RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - aas-app-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 3s
      retries: 5

  chatbot-service:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    image: chatbot-service
    container_name: chatbot-service
    ports:
      - "8093:8093"
    environment:
      - GEMINI_API_KEY={gemini.api.key}
    depends_on:
      rabbit-mq:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - aas-app-network

networks:
  aas-app-network:
    driver: bridge

volumes:
  rabbitmq-data: